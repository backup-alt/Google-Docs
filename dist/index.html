<div class="eyebrow">NORTHSTAR / PRODUCT & DESIGN</div><h1>Building what’s next.</h1><p class="document-subtitle">Product strategy & roadmap · Q3 2026</p><div class="doc-meta"><span class="meta-badge">WORKING DRAFT</span><span>Updated September 18, 2026</span></div><hr><h2>Overview</h2><p>Great products start with a clear point of view. This document brings together our direction, priorities, and the decisions that will shape the next chapter of Northstar.</p><p>Our focus this quarter is simple: <strong>help teams move from scattered ideas to meaningful progress.</strong> We’re investing in the foundations that make everyday work feel a little more connected, and a lot more intentional.</p><blockquote>Make space for the work that matters.</blockquote><h2>Our north star</h2><p>We’re building a workspace that feels effortless from the first moment. A place where teams can think clearly, work together, and turn good ideas into great outcomes.</p><p>Three principles will guide how we get there:</p><ul><li><strong>Clarity over complexity.</strong> Every interaction should make the next step obvious.</li><li><strong>Better, together.</strong> Collaboration belongs at the heart of the experience.</li><li><strong>Make the details count.</strong> Small, thoughtful improvements build lasting trust.</li></ul><h2>What we’re focusing on</h2><p>Our roadmap is organized around three priorities, each grounded in what we’ve heard from our customers.</p><table><thead><tr><th>Priority</th><th>What success looks like</th><th>Timing</th></tr></thead><tbody><tr><td>01 &nbsp; A simpler start</td><td>Get from sign-up to a first win, faster</td><td>July</td></tr><tr><td>02 &nbsp; Connected workflows</td><td>Less switching, more doing</td><td>August</td></tr><tr><td>03 &nbsp; Room to grow</td><td>A foundation that scales with every team</td><td>September</td></tr></tbody></table><h2>Measuring progress</h2><p>We’ll measure our impact through activation, weekly team engagement, and the quality of feedback from the people who use Northstar every day.</p><h2>Next steps</h2><ul><li>Align on priorities with the product and design teams.</li><li>Translate each focus area into a clear, actionable project brief.</li><li>Review progress together at the end of each month.</li></ul><p class="closing-note">A shared direction. A little more focus. Let’s build something that matters.</p></template><script src="app.js"></script></body></html>
